services:
  - type: web
    name: cybershield-banking-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://cybersecuritybanking.netlify.app
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
